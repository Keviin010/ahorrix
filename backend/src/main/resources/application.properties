spring.application.name=ahorrix-demo
server.port=${PORT:${SERVER_PORT:8081}}
spring.config.import=optional:file:./secrets.properties

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ahorrix_demo}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.horas=8
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
