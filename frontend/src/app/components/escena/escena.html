<div class="escena" aria-hidden="true">
  <div class="brillo b1"></div>
  <div class="brillo b2"></div>

  <div class="tarjeta">
    <div class="tarjeta-cabeza">
      <span class="foto">TV</span>
      <div>
        <p class="producto">Televisor Samsung 55"</p>
        <p class="tienda">Éxito · Tecnología</p>
      </div>
    </div>

    <svg class="grafica" viewBox="0 0 300 140">
      <line class="rejilla" x1="0" x2="300" y1="20" y2="20" />
      <line class="rejilla" x1="0" x2="300" y1="65" y2="65" />
      <line class="rejilla" x1="0" x2="300" y1="110" y2="110" />
      <line class="meta" x1="0" x2="300" [attr.y1]="yObjetivo" [attr.y2]="yObjetivo" />
      <path class="trazo" [attr.d]="trazo" pathLength="1" [style.stroke-dashoffset]="1 - avance()" />
      <circle class="punto" r="7" cx="0" cy="0" [style.transform]="punto()" />
    </svg>

    <div class="tarjeta-pie">
      <span [class.logrado]="llegoAlFinal()">{{ llegoAlFinal() ? 'Objetivo alcanzado' : 'Objetivo ' + objetivoTexto }}</span>
      <span class="numero">{{ precioActual() }}</span>
    </div>
  </div>

  <div class="colgante">
    <span class="clavo"></span>
    <span class="hilo"></span>
    <div class="etiqueta">
      <span class="agujero"></span>
      <small>Precio hoy</small>
      <strong class="numero">{{ precioActual() }}</strong>
    </div>
  </div>

  <div class="sello" [class.visible]="llegoAlFinal()">Bajó {{ ahorro }}%</div>

  <div class="chip c1">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>
    Alerta enviada a tu correo
  </div>
</div>
